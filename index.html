<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shiozaki_lab_projects</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/projects.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
    <!-- ローディング画面（中央にサイト名を表示） -->
    <div id="loading">
        <h1 class="site-name">SHIOZAKI LABORATORY</h1>
    </div>

    <!-- ヘッダーをインクルード -->
    <div id="header-container"></div>

    <!-- ページタイトルとソートボタン -->
    <div class="page-title">
        <div class="title-container">
            <h2 class="title-text"># Projects</h2>
            <div class="sort-button" data-sort="desc">↓ New</div>
        </div>
    </div>

    <!-- タグフィルター部分 -->
    <div class="tag-filter-section">
        <div class="tag-filters">
            <span class="tag-filter active" data-tag="All"># All</span>
            <span class="tag-filter" data-tag="Design"># Design</span>
            <span class="tag-filter" data-tag="Research"># Research</span>
            <span class="tag-filter" data-tag="Thesis"># Thesis</span>
            <span class="tag-filter" data-tag="Reading"># Reading</span>
            <span class="tag-filter" data-tag="Publication"># Publication</span>
            <span class="tag-filter" data-tag="Event"># Event</span>
        </div>
    </div>

    <!-- プロジェクトグリッド（スプレッドシートから動的生成） -->
    <div class="projects-grid" id="projects-grid">
        <p id="grid-loading" style="grid-column: 1 / -1; padding: 20px; color: #888;">
            読み込み中...
        </p>
    </div>

    <div id="footer-container"></div>

    <!-- Google Sheets 連携モジュール -->
    <script src="js/sheets.js"></script>

    <script>
        // ヘッダーとフッターを読み込む
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
            });

        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });

        // ------------------------------------------------
        // スプレッドシートからプロジェクトカードを生成する
        // ------------------------------------------------
        function createProjectCard(project) {
            const card = document.createElement('a');
            card.href = `project.html?id=${encodeURIComponent(project.id)}`;
            card.className = 'project-card';
            card.setAttribute('data-tags', project.tags);
            card.setAttribute('data-date', project.date);

            // 画像エリア
            const imageSquare = document.createElement('div');
            imageSquare.className = 'fixed-image-square';

            const imageContainer = document.createElement('div');
            imageContainer.className = 'project-image-container';

            const img = document.createElement('img');
            img.src = project.image_url;
            img.alt = project.title;
            img.className = 'project-image';

            imageContainer.appendChild(img);
            imageSquare.appendChild(imageContainer);

            // テキストエリア
            const textSquare = document.createElement('div');
            textSquare.className = 'fixed-text-square';

            const projectInfo = document.createElement('div');
            projectInfo.className = 'project-info';

            const titleSpan = document.createElement('span');
            titleSpan.className = 'project-title';
            titleSpan.textContent = project.title;

            const sepSpan = document.createElement('span');
            sepSpan.className = 'project-separator';
            sepSpan.textContent = ' / ';

            const dateSpan = document.createElement('span');
            dateSpan.className = 'project-date';
            dateSpan.textContent = project.date;

            projectInfo.appendChild(titleSpan);
            projectInfo.appendChild(sepSpan);
            projectInfo.appendChild(dateSpan);
            textSquare.appendChild(projectInfo);

            // カラースクエア（タグ別CSSで色が決まる）
            const colorSquare = document.createElement('div');
            colorSquare.className = 'project-square';

            card.appendChild(imageSquare);
            card.appendChild(textSquare);
            card.appendChild(colorSquare);

            return card;
        }

        // ------------------------------------------------
        // 日付ソート
        // ------------------------------------------------
        function sortProjectsByDate(order = 'desc') {
            const grid = document.getElementById('projects-grid');
            const cards = Array.from(grid.querySelectorAll('.project-card'));

            cards.sort((a, b) => {
                const dateA = a.getAttribute('data-date');
                const dateB = b.getAttribute('data-date');
                return order === 'desc'
                    ? dateB.localeCompare(dateA)
                    : dateA.localeCompare(dateB);
            });

            cards.forEach(card => grid.appendChild(card));
        }

        // ------------------------------------------------
        // タグフィルター
        // ------------------------------------------------
        function filterProjects(selectedTag) {
            document.querySelectorAll('.project-card').forEach(card => {
                const tags = card.getAttribute('data-tags');
                if (selectedTag === 'All' || tags.includes(selectedTag)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }

        // ------------------------------------------------
        // 初期化
        // ------------------------------------------------
        document.addEventListener('DOMContentLoaded', function () {
            // ローディング画面を2秒後にフェードアウト
            const loadingScreen = document.getElementById('loading');
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
            }, 2000);

            const grid = document.getElementById('projects-grid');

            // スプレッドシートからデータを取得してカードを生成
            fetchProjects()
                .then(projects => {
                    grid.innerHTML = ''; // 「読み込み中...」を消去
                    projects.forEach(project => {
                        grid.appendChild(createProjectCard(project));
                    });
                    sortProjectsByDate('desc'); // 初期表示は新しい順
                })
                .catch(err => {
                    grid.innerHTML =
                        '<p style="grid-column: 1 / -1; padding: 20px; color: #888;">' +
                        'プロジェクトの読み込みに失敗しました。<br>' +
                        'js/sheets.js の SPREADSHEET_ID を確認してください。' +
                        '</p>';
                    console.error('スプレッドシート読み込みエラー:', err);
                });

            // タグフィルターのイベント
            const tagFilters = document.querySelectorAll('.tag-filter');
            tagFilters.forEach(filter => {
                filter.addEventListener('click', function () {
                    tagFilters.forEach(f => f.classList.remove('active'));
                    this.classList.add('active');
                    filterProjects(this.getAttribute('data-tag'));
                });
            });

            // ソートボタンのイベント
            const sortButton = document.querySelector('.sort-button');
            sortButton.addEventListener('click', function () {
                const currentSort = this.getAttribute('data-sort');
                if (currentSort === 'desc') {
                    this.setAttribute('data-sort', 'asc');
                    this.innerHTML = '↑ Old';
                    sortProjectsByDate('asc');
                } else {
                    this.setAttribute('data-sort', 'desc');
                    this.innerHTML = '↓ New';
                    sortProjectsByDate('desc');
                }
            });
        });
    </script>
</body>
</html>
